<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Management Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        apple: {
                            gray: '#f5f5f7',
                            border: '#e5e5ea',
                            card: '#ffffff',
                            text: '#1d1d1f',
                            secondary: '#86868b',
                            accent: '#0071e3'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Custom scrollbar for subtle aesthetic */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="h-full text-slate-800 antialiased bg-slate-50 flex flex-col">

    <header class="sticky top-0 z-20 backdrop-blur-md bg-white/80 border-b border-slate-200/80 px-4 sm:px-8 py-3.5 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white shadow-md shadow-blue-500/20">
                <i class="fa-solid font-bold fa-list-check text-base"></i>
            </div>
            <div>
                <h1 class="text-lg font-semibold tracking-tight text-slate-900 leading-none">Task Flow</h1>
                <p class="text-xs text-slate-500 mt-0.5">Admin & Staff Workflow</p>
            </div>
        </div>

        <div class="flex items-center space-x-3">
            <button onclick="openAddTaskModal()" class="inline-flex items-center justify-center px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 active:bg-blue-800 rounded-xl shadow-sm transition-all duration-150 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-1">
                <i class="fa-solid fa-plus mr-2 text-xs"></i>
                <span>New Task</span>
            </button>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-8 py-6 space-y-6">

        <!-- Top Metric Counters -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4" id="statsContainer">
            <!-- Dynamically Populated Stats -->
        </div>

        <!-- Filter & Search Controls Toolbar -->
        <div class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-sm flex flex-col lg:flex-row gap-4 justify-between items-stretch lg:items-center">
            
            <!-- Search Bar -->
            <div class="relative flex-1">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                <input type="text" id="searchInput" oninput="applyFilters()" placeholder="Search task, assignee, or approver..." class="w-full pl-10 pr-4 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 transition-all">
            </div>

            <!-- Select Filters Dropdowns -->
            <div class="flex flex-wrap sm:flex-nowrap items-center gap-2.5">
                <!-- Assignee Filter -->
                <div class="relative min-w-[130px] flex-1 sm:flex-initial">
                    <select id="filterAssignee" onchange="applyFilters()" class="w-full appearance-none pl-3 pr-8 py-2 text-xs font-medium bg-slate-50 border border-slate-200 rounded-xl text-slate-700 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 cursor-pointer">
                        <option value="ALL">All Assignees</option>
                        <option value="Angela">Angela</option>
                        <option value="Aman">Aman</option>
                        <option value="Jenny">Jenny</option>
                        <option value="Kaushal">Kaushal</option>
                    </select>
                    <i class="fa-solid fa-chevron-down absolute right-3 top-1/2 -translate-y-1/2 text-xs text-slate-400 pointer-events-none"></i>
                </div>

                <!-- Priority Filter -->
                <div class="relative min-w-[120px] flex-1 sm:flex-initial">
                    <select id="filterPriority" onchange="applyFilters()" class="w-full appearance-none pl-3 pr-8 py-2 text-xs font-medium bg-slate-50 border border-slate-200 rounded-xl text-slate-700 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 cursor-pointer">
                        <option value="ALL">All Priorities</option>
                        <option value="Critical">Critical</option>
                        <option value="Urgent">Urgent</option>
                        <option value="Normal">Normal</option>
                    </select>
                    <i class="fa-solid fa-chevron-down absolute right-3 top-1/2 -translate-y-1/2 text-xs text-slate-400 pointer-events-none"></i>
                </div>

                <!-- Status Filter -->
                <div class="relative min-w-[120px] flex-1 sm:flex-initial">
                    <select id="filterStatus" onchange="applyFilters()" class="w-full appearance-none pl-3 pr-8 py-2 text-xs font-medium bg-slate-50 border border-slate-200 rounded-xl text-slate-700 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 cursor-pointer">
                        <option value="ALL">All Statuses</option>
                        <option value="Assigned">Assigned</option>
                        <option value="Pending">Pending</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Completed">Completed</option>
                    </select>
                    <i class="fa-solid fa-chevron-down absolute right-3 top-1/2 -translate-y-1/2 text-xs text-slate-400 pointer-events-none"></i>
                </div>

                <!-- Reset Button -->
                <button onclick="resetFilters()" class="px-3 py-2 text-xs font-medium text-slate-500 hover:text-slate-800 hover:bg-slate-100 rounded-xl transition-all">
                    Reset
                </button>
            </div>
        </div>

        <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden hidden md:block">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50/70 border-b border-slate-200/80 text-[11px] font-semibold text-slate-500 uppercase tracking-wider">
                            <th class="py-3.5 px-5">To (Assignee)</th>
                            <th class="py-3.5 px-4">Task Description</th>
                            <th class="py-3.5 px-4">Assigned By</th>
                            <th class="py-3.5 px-4">Approver</th>
                            <th class="py-3.5 px-4">Priority</th>
                            <th class="py-3.5 px-4">Deadline</th>
                            <th class="py-3.5 px-4">Status</th>
                            <th class="py-3.5 px-4 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="taskTableBody" class="divide-y divide-slate-100 text-sm">
                        <!-- Dynamic Rows loaded via JS -->
                    </tbody>
                </table>
            </div>
            <div id="emptyStateTable" class="hidden text-center py-12">
                <i class="fa-regular fa-folder-open text-3xl text-slate-300 mb-2"></i>
                <p class="text-sm font-medium text-slate-600">No matching tasks found</p>
                <p class="text-xs text-slate-400">Try adjusting your filters or search keywords.</p>
            </div>
        </div>

        <div class="block md:hidden space-y-3" id="taskCardsContainer">
            <!-- Dynamic Cards loaded via JS -->
        </div>

    </main>

    <div id="taskModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm hidden transition-opacity">
        <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl border border-slate-100 overflow-hidden transform transition-all">
            <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
                <h3 class="text-base font-semibold text-slate-800">Add New Task</h3>
                <button onclick="closeAddTaskModal()" class="text-slate-400 hover:text-slate-600 w-8 h-8 rounded-full flex items-center justify-center hover:bg-slate-100 transition-colors">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form id="newTaskForm" onsubmit="handleAddTask(event)" class="p-6 space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Task Description</label>
                    <input type="text" id="taskDescription" required placeholder="e.g. Update marketing brochure" class="w-full px-3.5 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Assign To (Staff)</label>
                        <input type="text" id="taskTo" required placeholder="e.g. Angela" class="w-full px-3.5 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Assigned By</label>
                        <input type="text" id="taskAssignedBy" required placeholder="e.g. Admin" value="Admin" class="w-full px-3.5 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Approver</label>
                        <input type="text" id="taskApprover" required placeholder="e.g. Jenny" class="w-full px-3.5 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Deadline</label>
                        <input type="text" id="taskDeadline" required placeholder="e.g. 3 days / Oct 15" class="w-full px-3.5 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Priority Level</label>
                        <select id="taskPriority" class="w-full px-3.5 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500">
                            <option value="Normal">Normal</option>
                            <option value="Urgent">Urgent</option>
                            <option value="Critical">Critical</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Initial Status</label>
                        <select id="taskStatus" class="w-full px-3.5 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500">
                            <option value="Assigned">Assigned</option>
                            <option value="Pending">Pending</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Completed">Completed</option>
                        </select>
                    </div>
                </div>

                <div class="pt-3 flex justify-end space-x-2">
                    <button type="button" onclick="closeAddTaskModal()" class="px-4 py-2 text-xs font-medium text-slate-600 hover:bg-slate-100 rounded-xl transition-colors">Cancel</button>
                    <button type="submit" class="px-4 py-2 text-xs font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-xl shadow-sm transition-all">Save Task</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Default initial task items based on prompt details
        let tasks = [
            {
                id: 1,
                to: "Angela",
                assignedBy: "Admin",
                task: "WhatsApp catalog",
                approver: "Jenny",
                priority: "Normal",
                deadline: "3 days",
                status: "Assigned"
            },
            {
                id: 2,
                to: "Aman",
                assignedBy: "Aarya",
                task: "Hath yog poses list",
                approver: "Aarya",
                priority: "Urgent",
                deadline: "1 week",
                status: "Pending"
            },
            {
                id: 3,
                to: "Jenny",
                assignedBy: "Admin",
                task: "Event calendar 2027",
                approver: "Admin",
                priority: "Normal",
                deadline: "1 month",
                status: "Assigned"
            },
            {
                id: 4,
                to: "Kaushal",
                assignedBy: "Admin",
                task: "App 200 price glitch",
                approver: "Aarya",
                priority: "Critical",
                deadline: "ASAP",
                status: "Pending"
            }
        ];

        function getPriorityBadge(priority) {
            switch(priority) {
                case 'Critical':
                    return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-rose-50 text-rose-700 border border-rose-200/60"><span class="w-1.5 h-1.5 rounded-full bg-rose-500 mr-1.5"></span>Critical</span>`;
                case 'Urgent':
                    return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-amber-50 text-amber-700 border border-amber-200/60"><span class="w-1.5 h-1.5 rounded-full bg-amber-500 mr-1.5"></span>Urgent</span>`;
                default:
                    return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-blue-50 text-blue-700 border border-blue-200/60"><span class="w-1.5 h-1.5 rounded-full bg-blue-500 mr-1.5"></span>Normal</span>`;
            }
        }

        function getStatusSelectClass(status) {
            switch(status) {
                case 'Completed': return 'bg-emerald-50 text-emerald-700 border-emerald-200/80';
                case 'In Progress': return 'bg-sky-50 text-sky-700 border-sky-200/80';
                case 'Pending': return 'bg-amber-50 text-amber-700 border-amber-200/80';
                default: return 'bg-purple-50 text-purple-700 border-purple-200/80'; // Assigned
            }
        }

        function getAvatarColor(name) {
            const colors = ['bg-indigo-500', 'bg-blue-500', 'bg-emerald-500', 'bg-rose-500', 'bg-amber-500', 'bg-purple-500'];
            let hash = 0;
            for (let i = 0; i < name.length; i++) {
                hash = name.charCodeAt(i) + ((hash << 5) - hash);
            }
            return colors[Math.abs(hash) % colors.length];
        }

        function renderDashboard() {
            const tableBody = document.getElementById('taskTableBody');
            const cardsContainer = document.getElementById('taskCardsContainer');
            const emptyState = document.getElementById('emptyStateTable');

            const filteredTasks = getFilteredTasks();

            // Update Statistics Summary Cards
            renderStats();

            // Clear containers
            tableBody.innerHTML = '';
            cardsContainer.innerHTML = '';

            if (filteredTasks.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
            }

            filteredTasks.forEach(t => {
                // Render Table Row (Desktop)
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50/80 transition-colors";
                tr.innerHTML = `
                    <td class="py-3.5 px-5 font-medium text-slate-900">
                        <div class="flex items-center space-x-2.5">
                            <div class="w-7 h-7 rounded-full ${getAvatarColor(t.to)} text-white text-[10px] font-bold flex items-center justify-center">
                                ${t.to.substring(0, 2).toUpperCase()}
                            </div>
                            <span>${t.to}</span>
                        </div>
                    </td>
                    <td class="py-3.5 px-4 font-medium text-slate-800">${t.task}</td>
                    <td class="py-3.5 px-4 text-slate-600 text-xs">${t.assignedBy}</td>
                    <td class="py-3.5 px-4 text-slate-600 text-xs">${t.approver}</td>
                    <td class="py-3.5 px-4">${getPriorityBadge(t.priority)}</td>
                    <td class="py-3.5 px-4 text-xs font-medium text-slate-600">
                        <i class="fa-regular fa-clock mr-1 text-slate-400"></i>${t.deadline}
                    </td>
                    <td class="py-3.5 px-4">
                        <select onchange="updateTaskStatus(${t.id}, this.value)" class="text-xs font-medium py-1 px-2.5 rounded-lg border cursor-pointer focus:outline-none transition-colors ${getStatusSelectClass(t.status)}">
                            <option value="Assigned" ${t.status === 'Assigned' ? 'selected' : ''}>Assigned</option>
                            <option value="Pending" ${t.status === 'Pending' ? 'selected' : ''}>Pending</option>
                            <option value="In Progress" ${t.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
                            <option value="Completed" ${t.status === 'Completed' ? 'selected' : ''}>Completed</option>
                        </select>
                    </td>
                    <td class="py-3.5 px-4 text-right">
                        <button onclick="deleteTask(${t.id})" class="text-slate-400 hover:text-rose-600 p-1.5 rounded-lg hover:bg-rose-50 transition-colors" title="Delete Task">
                            <i class="fa-regular fa-trash-can text-xs"></i>
                        </button>
                    </td>
                `;
                tableBody.appendChild(tr);

                // Render Mobile Card View
                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm space-y-3";
                card.innerHTML = `
                    <div class="flex items-start justify-between">
                        <div class="flex items-center space-x-2.5">
                            <div class="w-8 h-8 rounded-full ${getAvatarColor(t.to)} text-white text-xs font-bold flex items-center justify-center">
                                ${t.to.substring(0, 2).toUpperCase()}
                            </div>
                            <div>
                                <h4 class="text-sm font-semibold text-slate-900">${t.to}</h4>
                                <p class="text-[11px] text-slate-400">By ${t.assignedBy} • Approver: ${t.approver}</p>
                            </div>
                        </div>
                        ${getPriorityBadge(t.priority)}
                    </div>
                    
                    <div class="pt-1">
                        <p class="text-sm font-medium text-slate-800">${t.task}</p>
                    </div>

                    <div class="flex items-center justify-between pt-2 border-t border-slate-100">
                        <span class="text-xs text-slate-500"><i class="fa-regular fa-clock mr-1 text-slate-400"></i>${t.deadline}</span>
                        <div class="flex items-center space-x-2">
                            <select onchange="updateTaskStatus(${t.id}, this.value)" class="text-xs font-medium py-1 px-2.5 rounded-lg border cursor-pointer focus:outline-none ${getStatusSelectClass(t.status)}">
                                <option value="Assigned" ${t.status === 'Assigned' ? 'selected' : ''}>Assigned</option>
                                <option value="Pending" ${t.status === 'Pending' ? 'selected' : ''}>Pending</option>
                                <option value="In Progress" ${t.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
                                <option value="Completed" ${t.status === 'Completed' ? 'selected' : ''}>Completed</option>
                            </select>
                            <button onclick="deleteTask(${t.id})" class="text-slate-400 hover:text-rose-600 p-1.5">
                                <i class="fa-regular fa-trash-can text-xs"></i>
                            </button>
                        </div>
                    </div>
                `;
                cardsContainer.appendChild(card);
            });
        }

        function getFilteredTasks() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const assigneeFilter = document.getElementById('filterAssignee').value;
            const priorityFilter = document.getElementById('filterPriority').value;
            const statusFilter = document.getElementById('filterStatus').value;

            return tasks.filter(t => {
                const matchesSearch = t.task.toLowerCase().includes(query) ||
                                      t.to.toLowerCase().includes(query) ||
                                      t.assignedBy.toLowerCase().includes(query) ||
                                      t.approver.toLowerCase().includes(query);

                const matchesAssignee = (assigneeFilter === 'ALL') || (t.to.toLowerCase() === assigneeFilter.toLowerCase());
                const matchesPriority = (priorityFilter === 'ALL') || (t.priority.toLowerCase() === priorityFilter.toLowerCase());
                const matchesStatus = (statusFilter === 'ALL') || (t.status.toLowerCase() === statusFilter.toLowerCase());

                return matchesSearch && matchesAssignee && matchesPriority && matchesStatus;
            });
        }

        function applyFilters() {
            renderDashboard();
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('filterAssignee').value = 'ALL';
            document.getElementById('filterPriority').value = 'ALL';
            document.getElementById('filterStatus').value = 'ALL';
            renderDashboard();
        }

        function renderStats() {
            const container = document.getElementById('statsContainer');
            const total = tasks.length;
            const pending = tasks.filter(t => t.status === 'Pending').length;
            const inProgress = tasks.filter(t => t.status === 'In Progress' || t.status === 'Assigned').length;
            const completed = tasks.filter(t => t.status === 'Completed').length;

            container.innerHTML = `
                <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center font-bold text-sm">
                        ${total}
                    </div>
                    <div>
                        <p class="text-xs font-medium text-slate-400">Total Tasks</p>
                        <p class="text-base font-semibold text-slate-800">${total} Items</p>
                    </div>
                </div>

                <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center font-bold text-sm">
                        ${pending}
                    </div>
                    <div>
                        <p class="text-xs font-medium text-slate-400">Pending</p>
                        <p class="text-base font-semibold text-slate-800">${pending} Tasks</p>
                    </div>
                </div>

                <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-sky-50 text-sky-600 flex items-center justify-center font-bold text-sm">
                        ${inProgress}
                    </div>
                    <div>
                        <p class="text-xs font-medium text-slate-400">Active / Assigned</p>
                        <p class="text-base font-semibold text-slate-800">${inProgress} Active</p>
                    </div>
                </div>

                <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center font-bold text-sm">
                        ${completed}
                    </div>
                    <div>
                        <p class="text-xs font-medium text-slate-400">Completed</p>
                        <p class="text-base font-semibold text-slate-800">${completed} Done</p>
                    </div>
                </div>
            `;
        }

        function updateTaskStatus(id, newStatus) {
            tasks = tasks.map(t => t.id === id ? { ...t, status: newStatus } : t);
            renderDashboard();
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            renderDashboard();
        }

        function openAddTaskModal() {
            document.getElementById('taskModal').classList.remove('hidden');
        }

        function closeAddTaskModal() {
            document.getElementById('taskModal').classList.add('hidden');
            document.getElementById('newTaskForm').reset();
        }

        function handleAddTask(e) {
            e.preventDefault();
            const newTask = {
                id: Date.now(),
                task: document.getElementById('taskDescription').value,
                to: document.getElementById('taskTo').value,
                assignedBy: document.getElementById('taskAssignedBy').value,
                approver: document.getElementById('taskApprover').value,
                deadline: document.getElementById('taskDeadline').value,
                priority: document.getElementById('taskPriority').value,
                status: document.getElementById('taskStatus').value
            };

            tasks.unshift(newTask);
            
            // Add assignee option to dropdown if it's new
            const select = document.getElementById('filterAssignee');
            const exists = Array.from(select.options).some(opt => opt.value.toLowerCase() === newTask.to.toLowerCase());
            if (!exists) {
                const opt = document.createElement('option');
                opt.value = newTask.to;
                opt.textContent = newTask.to;
                select.appendChild(opt);
            }

            closeAddTaskModal();
            renderDashboard();
        }

        // Initialize view on window ready
        window.onload = function() {
            renderDashboard();
        };
    </script>
</body>
</html>
